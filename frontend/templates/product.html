{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4 text-center">商品评论分析</h2>
            
            <!-- 搜索框 -->
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="input-group input-group-lg">
                        <input type="text" id="productIdInput" class="form-control" placeholder="请输入商品链接 (例如: https://item.jd.com/123.html)">
                        <button class="btn btn-primary" type="button" id="searchBtn">
                            <i class="fas fa-search me-2"></i>分析
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 结果展示 -->
            <div id="productResult" class="card shadow-sm d-none">
                <div class="card-body p-4">
                    <div class="row">
                        <!-- 左侧：评论分布饼图 -->
                        <div class="col-md-5 mb-3 mb-md-0 d-flex flex-column align-items-center justify-content-center">
                            <h5 class="text-muted mb-3">评论情感分布</h5>
                            <div id="sentimentChart" style="width: 100%; height: 250px;"></div>
                        </div>
                        
                        <!-- 右侧：详细数据列表 -->
                        <div class="col-md-7">
                            <h5 class="text-start mb-3">详细数据</h5>
                            <ul class="list-group list-group-flush text-start">
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    商品名称
                                    <span id="productName" class="badge bg-light text-dark text-wrap text-end" style="max-width: 60%;">--</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    商品链接/ID
                                    <div class="d-flex align-items-center" style="max-width: 70%;">
                                        <span id="resProductId" class="badge bg-secondary rounded-pill text-truncate me-2" style="max-width: 200px; cursor: pointer;" title="点击复制">--</span>
                                        <button class="btn btn-sm btn-outline-secondary border-0" id="copyLinkBtn" title="复制完整链接">
                                            <i class="fas fa-copy"></i>
                                        </button>
                                    </div>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    总评论数
                                    <span id="totalReviews" class="fw-bold">--</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    虚假评论数
                                    <span id="fakeCount" class="fw-bold text-warning">--</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    虚假评论比例
                                    <span id="fakeRatio" class="fw-bold text-danger">--</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    情感分数
                                    <span id="sentimentScore" class="fw-bold">--</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    模型分析可信度
                                    <span id="trustScore" class="badge rounded-pill bg-success fs-6">--</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- 登录提示模态框 -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">登录验证</h5>
            </div>
            <div class="modal-body">
                <p>请前往爬虫打开的浏览器页面登录，登录成功后请点击下方按钮继续。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="stopCrawlerBtn">停止爬虫</button>
                <button type="button" class="btn btn-primary" id="loggedInBtn">我已登录</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/js/product.js"></script>
{% endblock %}
